<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JLPT N3 文法マスターテキスト（教科書・解説）</title>
  <style>
    :root {
      /* カラーパレット：メイン青 #1995AD × サクラピンク #FAF1F3 / #B8596E × ポイントネイビー #4D648D */
      --primary-blue: #1995AD;
      --primary-blue-dark: #127285;
      --primary-blue-light: #43B0C4;
      --primary-blue-pale: #EDF7F9;
      --primary-blue-border: #A1D6E2;

      --sakura-pink-bg: #FAF1F3;
      --sakura-pink-soft: #FDF7F8;
      --sakura-pink-accent: #E8A4B2;
      --sakura-pink-deep: #B8596E;
      --sakura-pink-hover: #CE5A73;
      --sakura-pink-border: #F2D5DB;

      --point-navy: #4D648D;
      --point-ice: #D0E1F9;

      --text-primary: #1F2D3D;
      --text-secondary: #4D648D;
      --text-muted: #6B7C8E;

      --card-bg: #FFFFFF;
      --card-border: #F2D5DB;
      --card-shadow: 0 8px 24px rgba(25, 149, 173, 0.07);

      --correct-green: #2E7D32;
      --correct-bg: #E8F5E9;
      --correct-border: #81C784;

      --app-font: 'Inter', "Yu Gothic", YuGothic, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--app-font);
      background-color: var(--sakura-pink-bg);
      color: var(--text-primary);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ルビタイポグラフィ制御 */
    ruby {
      ruby-position: over;
      ruby-align: center;
    }

    ruby rt {
      font-size: 0.54em;
      color: var(--primary-blue-dark);
      font-weight: 600;
      user-select: none;
      letter-spacing: 0;
      line-height: 1;
      transform: translateY(-2px);
    }

    body.hide-furigana ruby rt {
      display: none !important;
    }

    /* Site Header */
    .site-header {
      background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-blue-dark) 60%, var(--point-navy) 100%);
      color: #FFFFFF;
      padding: 12px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(18, 114, 133, 0.22);
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-n2 {
      background: var(--sakura-pink-deep);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      letter-spacing: 0.05em;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-btn {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .header-btn:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    /* Furigana Toggle Pill */
    .furigana-toggle {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 20px;
      padding: 2px;
      cursor: pointer;
      transition: all 0.25s ease;
      user-select: none;
    }

    .toggle-label {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 14px;
      transition: all 0.25s;
    }

    .toggle-label.active {
      background: #FFFFFF;
      color: var(--primary-blue-dark);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
    }

    .toggle-label.inactive {
      color: rgba(255, 255, 255, 0.75);
    }

    /* Mobile Sidebar Toggle Button */
    .btn-mobile-sidebar {
      display: none;
      background: var(--sakura-pink-deep);
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    /* App Layout: 2 Columns (Sidebar + Content) */
    .app-layout {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex: 1;
      padding: 16px 20px;
      gap: 24px;
      position: relative;
    }

    /* Left Sidebar (Categories like Flashcards) */
    .textbook-sidebar {
      width: 320px;
      flex-shrink: 0;
      background: var(--card-bg);
      border: 1px solid var(--sakura-pink-border);
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      padding: 18px 16px;
      height: calc(100vh - 100px);
      position: sticky;
      top: 80px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Search Bar */
    .sidebar-search-box {
      position: relative;
      margin-bottom: 12px;
    }

    .sidebar-search-input {
      width: 100%;
      padding: 9px 12px 9px 34px;
      border: 1.5px solid var(--point-ice);
      border-radius: 10px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      background: #FFFFFF;
      transition: border-color 0.2s;
    }

    .sidebar-search-input:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 3px rgba(25, 149, 173, 0.15);
    }

    .sidebar-search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
      pointer-events: none;
    }

    /* Filter Tabs & Progress */
    .sidebar-filter-tabs {
      display: flex;
      gap: 4px;
      background: var(--sakura-pink-bg);
      padding: 3px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .sidebar-filter-btn {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      padding: 6px 4px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      font-family: inherit;
    }

    .sidebar-filter-btn.active {
      background: #FFFFFF;
      color: var(--sakura-pink-deep);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    /* Progress Mini Bar */
    .sidebar-progress-box {
      background: var(--sakura-pink-soft);
      border: 1px solid var(--sakura-pink-border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 12px;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .progress-bar-bg {
      height: 6px;
      background: #E2ECF2;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-blue), var(--sakura-pink-deep));
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Category List Scroll Area */
    .sidebar-cats-scroll {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
    }

    .sidebar-cats-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .sidebar-cats-scroll::-webkit-scrollbar-thumb {
      background: var(--sakura-pink-border);
      border-radius: 3px;
    }

    .cat-group-heading {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--text-muted);
      margin: 14px 4px 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .cat-unit-card {
      margin-bottom: 6px;
      border: 1px solid var(--sakura-pink-border);
      border-radius: 10px;
      overflow: hidden;
      background: #FFFFFF;
      transition: border-color 0.2s;
    }

    .cat-unit-card.active-unit {
      border-color: var(--primary-blue);
    }

    .cat-unit-header {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      background: #FFFFFF;
      transition: background 0.15s;
    }

    .cat-unit-header:hover {
      background: var(--sakura-pink-soft);
    }

    .cat-unit-title {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cat-unit-count {
      font-size: 11px;
      font-weight: 800;
      background: var(--sakura-pink-bg);
      color: var(--sakura-pink-deep);
      padding: 2px 7px;
      border-radius: 10px;
    }

    .cat-grammar-list {
      display: none;
      background: #FFFFFF; /* 選択以外は白 */
      border-top: 1px solid var(--sakura-pink-border);
      padding: 4px 0;
    }

    .cat-unit-card.expanded .cat-grammar-list {
      display: block;
    }

    .cat-grammar-item {
      padding: 8px 12px 8px 24px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      background: #FFFFFF; /* 未選択項目は白 */
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s;
    }

    .cat-grammar-item:hover {
      background: var(--sakura-pink-soft);
      color: var(--primary-blue-dark);
      padding-left: 28px;
    }

    .cat-grammar-item.active {
      background: var(--primary-blue-pale) !important; /* 選択しているところは青のまま */
      color: var(--primary-blue-dark);
      font-weight: 800;
      border-left: 4px solid var(--primary-blue);
    }

    .grammar-item-badges {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
    }

    .badge-mastered-icon {
      color: var(--correct-green);
    }

    .badge-star-icon {
      color: #D97706;
    }

    /* Right Main Content Area */
    .textbook-main {
      flex: 1;
      min-width: 0;
      padding-bottom: 60px;
    }

    /* Bilingual Text Enhancements */
    .brand-title-en {
      font-size: 13px;
      font-weight: 600;
      color: #EDF7F9;
      opacity: 0.9;
      margin-left: 6px;
    }
    .btn-sub-en {
      font-size: 10.5px;
      opacity: 0.85;
    }
    .filter-en {
      font-size: 10px;
      opacity: 0.85;
    }
    .progress-label-en {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      margin-left: 4px;
    }
    .cat-group-heading {
      font-size: 11.5px;
      font-weight: 800;
      color: #8A6570;
      margin: 14px 4px 6px;
      letter-spacing: 0.04em;
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }
    .cat-group-en {
      font-size: 10.5px;
      font-weight: 600;
      color: #94A3B8;
    }
    .cat-unit-title {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--text-primary);
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }
    .cat-unit-name-ja {
      flex-shrink: 0;
    }
    .cat-unit-name-en {
      font-size: 11px;
      font-weight: 600;
      color: #64748B;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }
    .cat-grammar-item {
      padding: 8px 12px 8px 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      background: #FFFFFF;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      transition: all 0.15s;
      border-bottom: 1px solid rgba(240, 240, 240, 0.7);
    }
    .cat-grammar-item:hover {
      background: var(--sakura-pink-soft);
      color: var(--primary-blue-dark);
      padding-left: 20px;
    }
    .cat-grammar-item.active {
      background: var(--primary-blue-pale) !important;
      color: var(--primary-blue-dark);
      font-weight: 800;
      border-left: 4px solid var(--primary-blue);
    }
    .cat-grammar-info {
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }
    .cat-grammar-ja {
      font-weight: 700;
      font-size: 13px;
      color: var(--text-primary);
      flex-shrink: 0;
    }
    .cat-grammar-en {
      font-size: 11px;
      color: #64748B;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }
    .cat-grammar-item.active .cat-grammar-ja {
      color: var(--primary-blue-dark);
    }
    .cat-grammar-item.active .cat-grammar-en {
      color: var(--primary-blue);
      font-weight: 600;
      opacity: 0.95;
    }

    /* Weakness Drill Button in Sidebar */
    .sidebar-weakness-box {
      padding: 0 16px 12px 16px;
    }
    .btn-weakness-trigger {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      background: linear-gradient(135deg, #FFF1F2 0%, #FFE4E6 100%);
      border: 1px solid #FECDD3;
      border-radius: 10px;
      color: #BE123C;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 6px rgba(190, 18, 60, 0.08);
    }
    .btn-weakness-trigger:hover {
      background: linear-gradient(135deg, #FFE4E6 0%, #FECDD3 100%);
      transform: translateY(-1px);
    }
    .weakness-btn-title {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .weakness-btn-en {
      font-size: 10.5px;
      font-weight: 600;
      opacity: 0.85;
    }
    .weakness-count-pill {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 10px;
      background: #BE123C;
      color: #FFFFFF;
      transition: all 0.2s;
    }
    .weakness-count-pill.zero {
      background: #E2E8F0;
      color: #64748B;
    }

    /* Sticky Bottom Navigation */
    .sticky-bottom-nav {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 40px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.16);
      border: 1px solid rgba(25, 149, 173, 0.3);
      max-width: 94vw;
      animation: slideUpFade 0.25s ease-out;
    }
    @keyframes slideUpFade {
      from { opacity: 0; transform: translate(-50%, 20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    .sticky-nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--primary-blue-border);
      background: var(--primary-blue-pale);
      color: var(--primary-blue-dark);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .sticky-nav-btn:hover:not(:disabled) {
      background: var(--primary-blue);
      color: #FFFFFF;
      border-color: var(--primary-blue);
    }
    .sticky-nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .sticky-nav-center {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sticky-lesson-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-primary);
      white-space: nowrap;
      max-width: 170px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sticky-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sticky-action-pill {
      padding: 5px 11px;
      font-size: 11.5px;
      font-weight: 700;
      border-radius: 12px;
      border: 1px solid #CBD5E1;
      background: #F8FAFC;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .sticky-action-pill:hover {
      border-color: var(--primary-blue);
      color: var(--primary-blue-dark);
    }
    .sticky-action-pill.active-master {
      background: #DCFCE7 !important;
      color: #15803D !important;
      border-color: #86EFAC !important;
    }
    .sticky-action-pill.active-star {
      background: #FEF3C7 !important;
      color: #B45309 !important;
      border-color: #FCD34D !important;
    }

    /* Audio Shadowing Controls in Examples Section */
    .examples-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .examples-header-row .section-tag {
      margin-bottom: 0;
    }
    .btn-shadowing-play {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      background: #F0FDF4;
      border: 1px solid #86EFAC;
      color: #15803D;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-shadowing-play:hover {
      background: #DCFCE7;
      transform: translateY(-1px);
    }
    .btn-shadowing-play.is-playing {
      background: #FEF2F2 !important;
      border-color: #FCA5A5 !important;
      color: #B91C1C !important;
      animation: pulseGlow 1.5s infinite;
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .example-item-card.is-active-audio {
      border-color: #10B981 !important;
      background: #F0FDF4 !important;
      transform: scale(1.01);
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.15);
    }

    /* Active Recall Mode for Contrast Cards */
    .trap-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .btn-test-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 16px;
      background: #FFFBEB;
      border: 1px solid #FCD34D;
      color: #92400E;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-test-toggle:hover {
      background: #FEF3C7;
    }
    .btn-test-toggle.active {
      background: #92400E;
      color: #FFFFFF;
      border-color: #92400E;
    }
    .masked-reason-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: #FEF3C7;
      border: 1px dashed #D97706;
      border-radius: 8px;
      color: #92400E;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .masked-reason-btn:hover {
      background: #FDE68A;
      transform: scale(1.02);
    }

    /* Weakness Drill Modal */
    .modal-weakness-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 3000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-weakness-overlay.open {
      display: flex;
    }
    .modal-weakness-window {
      background: #FFFFFF;
      border-radius: 16px;
      max-width: 680px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      animation: modalScaleIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modalScaleIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-weakness-head {
      padding: 16px 20px;
      background: linear-gradient(135deg, #FFF1F2 0%, #FFE4E6 100%);
      border-bottom: 1px solid #FECDD3;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-weakness-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 800;
      color: #BE123C;
    }
    .modal-weakness-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }
    .weakness-empty-state {
      text-align: center;
      padding: 40px 20px;
    }
    .weakness-empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    .weakness-empty-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .weakness-empty-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .weakness-drill-card {
      margin-bottom: 16px;
      border: 1px solid var(--sakura-pink-border);
      border-radius: 12px;
      padding: 16px;
      background: #FFFFFF;
    }
    .weakness-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .weakness-grammar-tag {
      font-size: 11.5px;
      font-weight: 700;
      background: var(--primary-blue-pale);
      color: var(--primary-blue-dark);
      padding: 3px 8px;
      border-radius: 8px;
    }
    .nav-sub-en {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      margin-left: 4px;
    }

    /* Lesson Entry Card */
    .lesson-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--sakura-pink-border);
      box-shadow: var(--card-shadow);
      padding: 30px;
      margin-bottom: 24px;
    }

    .lesson-header {
      border-bottom: 2px solid var(--sakura-pink-bg);
      padding-bottom: 16px;
      margin-bottom: 22px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .lesson-header-left {
      flex: 1;
    }



    .grammar-title-wrap {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .grammar-name {
      font-size: 26px;
      font-weight: 900;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .grammar-meaning-en {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    /* Action Buttons in Header (Bookmark & Mastered) */
    .lesson-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-pill-btn {
      background: #FFFFFF;
      border: 1.5px solid var(--sakura-pink-border);
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      color: var(--text-secondary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
      font-family: inherit;
    }

    .action-pill-btn:hover {
      background: var(--sakura-pink-soft);
      border-color: var(--sakura-pink-deep);
      color: var(--sakura-pink-deep);
    }

    .action-pill-btn.bookmarked {
      background: #FFFBEB;
      border-color: #FCD34D;
      color: #B45309;
    }

    .action-pill-btn.mastered {
      background: var(--correct-bg);
      border-color: var(--correct-border);
      color: var(--correct-green);
    }

    /* Section Tag */
    .section-block {
      margin-bottom: 24px;
    }

    /* 統一された大枠コンテナ（白背景 ＋ サクラピンク枠線） */
    .textbook-section-box {
      background: #FFFFFF;
      border: 1.5px solid var(--sakura-pink-border);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .section-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--primary-blue-dark);
      background: var(--primary-blue-pale);
      border: 1.5px solid var(--primary-blue-border);
      padding: 5px 13px;
      border-radius: 8px;
      margin-bottom: 14px;
    }

    .section-tag.blue {
      color: #0E7490;
      background: #EDF7F9;
      border-color: #A1D6E2;
    }

    .section-tag.amber {
      color: #B45309;
      background: #FFFBEB;
      border-color: #FDE68A;
    }

    /* Connection Box (清潔感のあるホワイト×シアンアクセント) */
    .connection-box {
      background: #FFFFFF;
      border-left: 4px solid var(--primary-blue);
      padding: 16px 20px;
      border-radius: 0 12px 12px 0;
      font-size: 14px;
      border-top: 1px solid #E2ECF2;
      border-right: 1px solid #E2ECF2;
      border-bottom: 1px solid #E2ECF2;
    }

    .connection-formula {
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 8px;
      line-height: 1.8;
      font-size: 15px;
    }

    .connection-notes {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* Bilingual Callout Cards (Core Nuance & English Pitfalls) */
    .bilingual-card {
      border-radius: 14px;
      padding: 20px 22px;
      margin-bottom: 22px;
    }

    .bilingual-card.nuance {
      background: var(--primary-blue-pale); /* コアニュアンスは青 */
      border: 1.5px solid var(--primary-blue-border);
    }

    /* ⚠️ 英語直訳の落とし穴：注意・警告なのでイエローゴールドに改善！ */
    .bilingual-card.trap {
      background: #FFFBEB; /* 温かみのある注意イエロー */
      border: 1.5px solid #FDE68A;
    }

    .bilingual-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .bilingual-card.nuance .bilingual-header {
      color: var(--primary-blue-dark); /* 青のタイトル */
    }

    .bilingual-card.trap .bilingual-header {
      color: #B45309; /* アンバーブラウン */
    }

    .content-ja {
      font-size: 14.5px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 12px;
      line-height: 1.8;
    }

    .content-en {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      line-height: 1.65;
      padding-top: 12px;
      border-top: 1px dashed rgba(25, 149, 173, 0.25);
    }

    .bilingual-card.trap .content-en {
      border-top-color: rgba(180, 83, 9, 0.25);
      color: #78350F;
    }

    /* Contrast Cards (改行崩れ・窮屈さを完全解消した独立カード構造) */
    .contrast-cards-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 14px;
    }

    /* 対比カード：スクショのピンクと青の太い線を消して、全面スッキリ純白に */
    .contrast-card {
      background: #FFFFFF !important;
      border-radius: 12px;
      padding: 14px 18px;
      border: 1.5px solid #F1E5E8;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .contrast-card.wrong {
      border: 1.5px solid #F1E5E8 !important; /* 左側のピンク帯を消去 */
      background: #FFFFFF !important;
    }

    .contrast-card.correct {
      border: 1.5px solid #F1E5E8 !important; /* 左側の青帯を消去 */
      background: #FFFFFF !important;
    }

    .contrast-card-top {
      display: flex;
      align-items: center;
      justify-content: flex-start; /* 離れずにバッジのすぐ横に理由を配置 */
      gap: 12px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .contrast-pill {
      font-size: 11.5px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .contrast-pill.wrong {
      background: #FAF1F3;
      color: var(--sakura-pink-deep); /* ぴんく */
      border: 1px solid var(--sakura-pink-border);
    }

    .contrast-pill.correct {
      background: var(--primary-blue-pale);
      color: var(--primary-blue-dark); /* 青 */
      border: 1px solid var(--primary-blue-border);
    }

    .contrast-reason-bilingual {
      font-size: 12.5px;
      font-weight: 700;
      color: #92400E;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .contrast-reason-en {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .contrast-sentence {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 2.2;
      margin-bottom: 6px;
    }

    .contrast-sentence strong {
      color: var(--primary-blue); /* 青 */
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .contrast-card.wrong .contrast-sentence strong {
      color: var(--sakura-pink-deep); /* ぴんく */
    }

    .contrast-en-note {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.55;
      padding-top: 6px;
      border-top: 1px dashed var(--sakura-pink-border);
    }

    /* Comparison Table (青系ヘッダーで視認性を大幅向上) */
    .comparison-table-wrap {
      overflow-x: auto;
      margin-bottom: 0;
      border-radius: 12px;
      border: 1.5px solid #E2ECF2;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
      background: #FFFFFF;
    }

    .comparison-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: #FFFFFF;
      min-width: 620px;
    }

    .comparison-table th {
      background: #EDF7F9; /* シアン青系の上品なヘッダー背景 */
      color: var(--primary-blue-dark);
      font-weight: 800;
      text-align: left;
      padding: 12px 14px;
      border-bottom: 2px solid #A1D6E2;
    }

    .comparison-table td {
      padding: 14px;
      border-bottom: 1px solid #F1F5F9;
      vertical-align: top;
      line-height: 1.9;
    }

    .comparison-table tr:last-child td {
      border-bottom: none;
    }

    .badge-result-bad {
      background: #FEF2F2;
      color: #DC2626;
      font-weight: 800;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 4px;
      border: 1px solid #FECACA;
      white-space: nowrap;
    }

    .badge-result-both {
      background: #EDF7F9;
      color: #127285;
      font-weight: 800;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 4px;
      border: 1px solid #A1D6E2;
      white-space: nowrap;
    }

    .badge-result-neutral {
      background: #F1F5F9;
      color: #475569;
      font-weight: 800;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 4px;
      border: 1px solid #CBD5E1;
      white-space: nowrap;
    }

    .badge-result-good {
      background: #E8F5E9;
      color: #2E7D32;
      font-weight: 800;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 4px;
      border: 1px solid #A5D6A7;
      white-space: nowrap;
    }

    .badge-result-warn {
      background: #FFFBEB;
      color: #B45309;
      font-weight: 800;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 4px;
      border: 1px solid #FDE68A;
      white-space: nowrap;
    }

    .badge-result-formal {
      background: #F3E5F5;
      color: #6A1B9A;
      font-weight: 800;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 4px;
      border: 1px solid #CE93D8;
      white-space: nowrap;
    }

    .table-sub-en {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 3px;
      line-height: 1.4;
    }

    /* Similar Box (語彙穴埋めマスター Image 4 完全準拠デザイン) */
    .similar-box {
      background: #FFFFFF;
      border: 1.5px solid var(--sakura-pink-border);
      border-radius: 12px;
      padding: 12px 16px;
      margin-top: 18px;
      margin-bottom: 6px;
    }

    .similar-title {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--sakura-pink-deep);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .similar-items {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .similar-pill {
      background: var(--sakura-pink-soft);
      border: 1px solid var(--sakura-pink-border);
      color: var(--text-primary);
      padding: 4px 11px;
      border-radius: 16px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      user-select: none;
      font-family: inherit;
    }

    .similar-pill:hover {
      background: var(--primary-blue-pale);
      border-color: var(--primary-blue-light);
      color: var(--primary-blue-dark);
      transform: translateY(-1px);
    }

    .similar-pill .pill-reading {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-muted);
      margin-left: 2px;
    }

    /* Examples List (ピンク被りをなくし、クリーンな白背景とスレート枠で文字を最も読みやすく) */
    .examples-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 0;
    }

    .example-item-card {
      background: #FFFFFF; /* スッキリした純白背景 */
      border: 1.5px solid #E2E8F0;
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .example-item-card:hover {
      background: #F8FAFC;
      border-color: var(--primary-blue-border);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(25, 149, 173, 0.08);
    }

    .example-tts-btn {
      background: var(--primary-blue-pale);
      border: 1px solid var(--primary-blue-border);
      color: var(--primary-blue-dark);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 14px;
      transition: all 0.2s;
    }

    .example-tts-btn:hover {
      background: var(--primary-blue);
      color: #FFFFFF;
      border-color: var(--primary-blue);
      transform: scale(1.05);
    }

    .example-content {
      flex: 1;
    }

    .example-ja {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
      line-height: 2.2;
    }

    .example-en {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Mini Exercise Check (さっきの淡いサクラピンクに戻す) */
    .quiz-section {
      background: var(--sakura-pink-soft);
      border: 1px solid var(--sakura-pink-border);
      border-radius: 14px;
      padding: 24px;
      margin-top: 28px;
    }

    .quiz-section-header,
    .box-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .quiz-title,
    .box-section-title {
      font-size: 16.5px;
      font-weight: 900;
      color: var(--point-navy);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .box-section-sub {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .quiz-card {
      background: #FFFFFF;
      border-radius: 12px;
      border: 1px solid var(--sakura-pink-border);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }

    .quiz-qnum {
      font-size: 12px;
      font-weight: 800;
      color: var(--primary-blue-dark);
      margin-bottom: 8px;
    }

    .quiz-sentence {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 14px;
      line-height: 2.2;
    }

    .quiz-blank {
      display: inline-block;
      background: var(--primary-blue-pale);
      border: 1.5px dashed var(--primary-blue);
      color: var(--primary-blue-dark);
      padding: 0 12px;
      border-radius: 6px;
      margin: 0 4px;
      min-width: 60px;
      text-align: center;
    }

    .quiz-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .quiz-opt-btn {
      background: #FFFFFF;
      border: 1.5px solid var(--point-ice);
      padding: 11px 14px;
      border-radius: 8px;
      text-align: left;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      line-height: 1.8;
    }

    .quiz-opt-btn:hover {
      border-color: var(--primary-blue);
      background: var(--primary-blue-pale);
    }

    .quiz-opt-btn.correct {
      background: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: var(--correct-green) !important;
      font-weight: 800;
    }

    .quiz-opt-btn.wrong {
      background: #FAF1F3 !important;
      border-color: var(--sakura-pink-border) !important;
      color: var(--sakura-pink-deep) !important;
    }

    .quiz-feedback {
      display: none;
      background: var(--sakura-pink-soft);
      border-radius: 8px;
      padding: 14px;
      margin-top: 10px;
      border-left: 4px solid var(--primary-blue);
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .quiz-feedback.is-correct {
      border-left-color: var(--correct-green);
      background: var(--correct-bg);
    }

    .quiz-feedback.is-wrong {
      border-left-color: var(--sakura-pink-deep);
      background: #FAF1F3;
    }

    .feedback-status {
      font-size: 13.5px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .feedback-status.correct { color: var(--correct-green); }
    .feedback-status.wrong { color: var(--sakura-pink-deep); }

    .feedback-ja {
      font-size: 13px;
      color: var(--text-primary);
      margin-bottom: 4px;
      line-height: 1.7;
    }

    .quiz-fb-tts-btn {
      background: var(--primary-blue-pale);
      border: 1px solid var(--primary-blue-border);
      color: var(--primary-blue-dark);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      flex-shrink: 0;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      margin-left: 6px;
    }

    .quiz-fb-tts-btn:hover {
      background: var(--primary-blue);
      color: #FFFFFF;
      border-color: var(--primary-blue);
      transform: scale(1.08);
    }

    .feedback-en {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* Clean Dojo Link (濃いネイビー帯を完全撤廃し、すっきり上品なピンクボタン単体に改善) */
    .dojo-clean-container {
      text-align: center;
      margin: 32px 0 20px;
    }

    .dojo-cta-btn-clean {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--sakura-pink-deep) 0%, var(--sakura-pink-hover) 100%);
      color: #FFFFFF;
      font-weight: 800;
      font-size: 14px;
      padding: 12px 28px;
      border-radius: 25px;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(184, 89, 110, 0.35);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dojo-cta-btn-clean:hover {
      background: var(--sakura-pink-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(184, 89, 110, 0.45);
    }

    /* Navigation Prev / Next */
    .lesson-nav-footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--sakura-pink-border);
    }

    .nav-arrow-btn {
      background: #FFFFFF;
      border: 1.5px solid var(--sakura-pink-border);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 800;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      font-family: inherit;
    }

    .nav-arrow-btn:hover {

    // Audio Speech with clean text
    let globalAudio = null;
    function speakJapaneseText(rawText) {
      if (!rawText) return;
      if (globalAudio) {
        try {
          globalAudio.pause();
          globalAudio.currentTime = 0;
        } catch(e) {}
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      const clean = String(rawText)
        .replace(/<rt>[\s\S]*?<\/rt>/gi, '')
        .replace(/<[^>]+>/g, '')
        .replace(/（\s*）|\(　*\)|（　*）/g, '、')
        .replace(/（する）|\(する\)/g, '')
        .replace(/[【】]/g, '')
        .replace(/\s+/g, ' ')
        .trim();

      if (clean.length <= 200) {
        try {
          const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=ja&client=tw-ob&q=${encodeURIComponent(clean)}`;
          globalAudio = new Audio(url);
          globalAudio.play().catch(() => fallbackSpeech(clean));
          return;
        } catch(e) {}
      }
      fallbackSpeech(clean);
    }

    function fallbackSpeech(text) {
      if (!('speechSynthesis' in window)) return;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP';
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    }

      const elCountDone = document.getElementById('countDone');

      const elProgressBarFill = document.getElementById('progressBarFill');

      if (elCountAll) elCountAll.textContent = countAll;
      if (elCountDone) elCountDone.textContent = countDone;
      if (elCountStar) elCountStar.textContent = countStar;

      const pct = countAll > 0 ? Math.round((countDone / countAll) * 100) : 0;
      if (elProgressText) elProgressText.textContent = `${countDone} / ${countAll} (${pct}%)`;
      if (elProgressBarFill) elProgressBarFill.style.width = `${pct}%`;
    }

    // Render Sidebar
    function renderSidebar() {
      const container = document.getElementById('sidebarCatsList');
      if (!container) return;

      container.innerHTML = '';
      let currentGroup = '';

      UNITS_DATA.forEach(unit => {
        if (unit.group !== currentGroup) {
          currentGroup = unit.group;
          const groupHead = document.createElement('div');
          groupHead.className = 'cat-group-heading';
          const groupEn = currentGroup.includes('基礎') 
            ? 'Foundations (Must-Know Basics)' 
            : 'Advanced (Essential for Passing)';
          groupHead.innerHTML = `
            <span class="cat-group-ja">${currentGroup}</span>
            <span class="cat-group-en">(${groupEn})</span>
          `;
          container.appendChild(groupHead);
        }

        // Filter unit grammars based on search & filter tabs
        const filteredGids = unit.gids.filter(gid => {
          const g = grammarMap.get(gid);
          if (!g) return false;

          // Filter Tab check
          if (currentFilter === 'star' && !userBookmarks.has(gid)) return false;
          if (currentFilter === 'done' && !userMastered.has(gid)) return false;

          // Search Query check
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            const matchName = g.name.toLowerCase().includes(q);
            const matchReading = (g.reading && g.reading.toLowerCase().includes(q)) || (g.reading_hiragana && g.reading_hiragana.includes(q));
            const matchMeaning = g.meaning_en.toLowerCase().includes(q);
            if (!matchName && !matchReading && !matchMeaning) return false;
          }
          return true;
        });

        if (filteredGids.length === 0 && (currentFilter !== 'all' || searchQuery)) {
          return; // Skip empty units in search/filter mode
        }

        const isUnitContainingCurrent = unit.gids.includes(currentGid);
        const unitCard = document.createElement('div');
        unitCard.className = `cat-unit-card ${isUnitContainingCurrent ? 'expanded active-unit' : ''}`;

        const unitHeader = document.createElement('div');
        unitHeader.className = 'cat-unit-header';
        unitHeader.innerHTML = `
          <div class="cat-unit-title">
            <span class="cat-unit-name-ja">${unit.name}</span>
            <span class="cat-unit-name-en">(${unit.name_en || ''})</span>
          </div>
          <span class="cat-unit-count">${filteredGids.length}</span>

        unitHeader.addEventListener('click', () => {
          unitCard.classList.toggle('expanded');
        });

        const grammarList = document.createElement('div');
        grammarList.className = 'cat-grammar-list';

        filteredGids.forEach(gid => {
          const g = grammarMap.get(gid);
          if (!g) return;

          const item = document.createElement('div');
          item.className = `cat-grammar-item ${gid === currentGid ? 'active' : ''}`;

          let badgesHtml = '';
          if (userMastered.has(gid)) {
            badgesHtml += '<span class="badge-mastered-icon" title="読了済み">✓</span>';
          }
          if (userBookmarks.has(gid)) {
            badgesHtml += '<span class="badge-star-icon" title="復習リスト">⭐</span>';
          }

          const shortEn = formatSidebarEn(g.meaning_en);
          item.title = `${g.name} : ${g.meaning_en || ''}`;

          item.innerHTML = `
            <div class="cat-grammar-info">
              <span class="cat-grammar-ja">${g.name}</span>
              ${shortEn ? `<span class="cat-grammar-en">(${escapeHtml(shortEn)})</span>` : ''}
            </div>
            <div class="grammar-item-badges">${badgesHtml}</div>
          `;

          item.addEventListener('click', () => {
            selectGrammar(gid);
            closeSidebarMobile();
          });

          grammarList.appendChild(item);
        });

        unitCard.appendChild(unitHeader);
        unitCard.appendChild(grammarList);
        container.appendChild(unitCard);
      });
    }

    function cleanSearchWord(w) {

        .replace(/<[^>]+>/g, '')

    // Generate candidate base forms (lemmatization) for conjugated verbs and adjectives
    function generateDeconjugations(word) {
      if (!word || word.length < 2) return [];
      const candidates = new Set();
      const w = word;

      // 1. て / た 形
      if (w.endsWith('って') || w.endsWith('った')) {
        const b = w.slice(0, -2);
        candidates.add(b + 'る');
        candidates.add(b + 'う');
        candidates.add(b + 'つ');
        candidates.add(b + 'く'); // 行く -> 行って/行った
      } else if (w.endsWith('いて') || w.endsWith('いた')) {
        const b = w.slice(0, -2);
        candidates.add(b + 'く');
      } else if (w.endsWith('いで') || w.endsWith('いだ')) {
        const b = w.slice(0, -2);
        candidates.add(b + 'ぐ');
      } else if (w.endsWith('して') || w.endsWith('した')) {
        const b = w.slice(0, -2);
        candidates.add(b + 'す');
        candidates.add(b + 'する');
      } else if (w.endsWith('んで') || w.endsWith('んだ')) {
        const b = w.slice(0, -2);
        candidates.add(b + 'む');
        candidates.add(b + 'ぶ');
        candidates.add(b + 'ぬ');
      }

      // 2. 受身・使役（待たされた、書かされた、食べられた等）
      if (w.endsWith('された') || w.endsWith('される') || w.endsWith('されたり')) {
        const b = w.slice(0, -3);
        candidates.add(b + 'する');
        candidates.add(b + 'す');
        if (b.endsWith('た')) candidates.add(b.slice(0, -1) + 'つ'); // 待たされた -> 待つ
        else if (b.endsWith('か')) candidates.add(b.slice(0, -1) + 'く');
        else if (b.endsWith('ま')) candidates.add(b.slice(0, -1) + 'む');
        else if (b.endsWith('ら')) candidates.add(b.slice(0, -1) + 'る');
        else if (b.endsWith('わ')) candidates.add(b.slice(0, -1) + 'う');
      }

      // 3. ない / なかった / なくて
      if (w.endsWith('なかった') || w.endsWith('なくて')) {
        const b = w.slice(0, -4);
        candidates.add(b + 'る');
        candidates.add(b + 'い');
      } else if (w.endsWith('ない')) {
        const b = w.slice(0, -2);
        candidates.add(b + 'る');
        candidates.add(b + 'い');
        if (b.endsWith('か')) candidates.add(b.slice(0, -1) + 'く');
        else if (b.endsWith('が')) candidates.add(b.slice(0, -1) + 'ぐ');
        else if (b.endsWith('さ')) candidates.add(b.slice(0, -1) + 'す');
        else if (b.endsWith('た')) candidates.add(b.slice(0, -1) + 'つ');
        else if (b.endsWith('な')) candidates.add(b.slice(0, -1) + 'ぬ');
        else if (b.endsWith('ば')) candidates.add(b.slice(0, -1) + 'ぶ');
        else if (b.endsWith('ま')) candidates.add(b.slice(0, -1) + 'む');
        else if (b.endsWith('ら')) candidates.add(b.slice(0, -1) + 'る');
        else if (b.endsWith('わ')) candidates.add(b.slice(0, -1) + 'う');
      }

      // 4. ます / ました / ません / まして
      for (const ending of ['ました', 'ません', 'まして', 'ます']) {
        if (w.endsWith(ending)) {
          const b = w.slice(0, -ending.length);
          candidates.add(b + 'る');
          if (b.endsWith('き')) candidates.add(b.slice(0, -1) + 'く');
          else if (b.endsWith('ぎ')) candidates.add(b.slice(0, -1) + 'ぐ');
          else if (b.endsWith('し')) candidates.add(b.slice(0, -1) + 'す');
          else if (b.endsWith('ち')) candidates.add(b.slice(0, -1) + 'つ');
          else if (b.endsWith('に')) candidates.add(b.slice(0, -1) + 'ぬ');
          else if (b.endsWith('び')) candidates.add(b.slice(0, -1) + 'ぶ');
          else if (b.endsWith('み')) candidates.add(b.slice(0, -1) + 'む');
          else if (b.endsWith('り')) candidates.add(b.slice(0, -1) + 'る');
          else if (b.endsWith('い')) candidates.add(b.slice(0, -1) + 'う');
          break;
        }
      }

      // 5. たい / たかった / たくて
      for (const ending of ['たかった', 'たくて', 'たい']) {
        if (w.endsWith(ending)) {
          const b = w.slice(0, -ending.length);
          candidates.add(b + 'る');
          if (b.endsWith('き')) candidates.add(b.slice(0, -1) + 'く');
          else if (b.endsWith('ぎ')) candidates.add(b.slice(0, -1) + 'ぐ');
          else if (b.endsWith('し')) candidates.add(b.slice(0, -1) + 'す');
          else if (b.endsWith('ち')) candidates.add(b.slice(0, -1) + 'つ');
          else if (b.endsWith('に')) candidates.add(b.slice(0, -1) + 'ぬ');
          else if (b.endsWith('び')) candidates.add(b.slice(0, -1) + 'ぶ');
          else if (b.endsWith('み')) candidates.add(b.slice(0, -1) + 'む');
          else if (b.endsWith('り')) candidates.add(b.slice(0, -1) + 'る');
          else if (b.endsWith('い')) candidates.add(b.slice(0, -1) + 'う');
          break;
        }
      }

      // 6. 形容詞: かった / くて / くない
      for (const ending of ['かった', 'くて', 'くない']) {
        if (w.endsWith(ending)) {
          const b = w.slice(0, -ending.length);
          candidates.add(b + 'い');
          break;
        }
      }

      // 7. 単純な て / た (食べた -> 食べる)
      if (w.endsWith('て') || w.endsWith('た')) {
        const b = w.slice(0, -1);
        candidates.add(b + 'る');
      }

      return Array.from(candidates);
    }

    function searchDictionary(query) {
      const cleanQ = cleanSearchWord(query);
      if (!cleanQ) return [];
      if (!window.DICT_DATA || !Array.isArray(window.DICT_DATA)) return [];

      const deconjugations = generateDeconjugations(cleanQ);
      const kanjis = cleanQ.match(/[一-龯]/g) || [];
      const kanjiStem = kanjis.length > 0 ? kanjis[0] : null;

      const scoredMatches = [];
      const seenWords = new Set();

      for (let i = 0; i < window.DICT_DATA.length; i++) {
        const d = window.DICT_DATA[i];
        if (!d || !d.w) continue;
        if (seenWords.has(d.w)) continue;

        let score = 0;
        let matchType = '';

        if (d.w === cleanQ || d.r === cleanQ) {
          score = 100;
          matchType = '完全一致';
        } else if (deconjugations.includes(d.w)) {
          score = 90;
          matchType = '基本形（原形）';
        } else if (d.w.startsWith(cleanQ) || (d.r && d.r.startsWith(cleanQ))) {
          score = 80;
          matchType = '前方一致';
        } else if (kanjiStem && d.w.startsWith(kanjiStem)) {
          score = 70;
          matchType = '同じ漢字で始まる語';
        } else if (kanjiStem && d.w.includes(kanjiStem)) {
          score = 60;
          matchType = '関連語（同じ漢字を含む）';
        } else if (d.w.includes(cleanQ) || (d.r && d.r.includes(cleanQ))) {
          score = 50;
          matchType = '部分一致';
        }

        if (score > 0) {
          seenWords.add(d.w);
          scoredMatches.push({
            score: score,
            matchType: matchType,
            term: d.w,
            reading: d.r || d.w,
            meaning: Array.isArray(d.m) ? d.m.join(', ') : (d.m || ''),
            level: d.l ? `JLPT ${d.l}` : '常用語',
            example_ja: d.ex || '',
            example_en: d.tr || '',
            similar: d.sim || ''
          });
        }
      }

      scoredMatches.sort((a, b) => b.score - a.score || a.term.length - b.term.length);
      return scoredMatches.slice(0, 6);
    }

    // Search JLPT Grammar & Expressions across all levels (N1-N5 + similar/related)
    function searchGrammarDictionary(query) {
      const cleanQ = cleanSearchWord(query);
      if (!cleanQ) return [];
      if (!window.JLPT_ALL_GRAMMAR_DICT || !Array.isArray(window.JLPT_ALL_GRAMMAR_DICT)) return [];

      const scoredMatches = [];
      const seen = new Set();

      for (let i = 0; i < window.JLPT_ALL_GRAMMAR_DICT.length; i++) {
        const item = window.JLPT_ALL_GRAMMAR_DICT[i];
        if (!item || !item.term) continue;

        const cleanTerm = cleanSearchWord(item.term);
        const cleanReading = cleanSearchWord(item.reading || '');
        const uniqueKey = cleanTerm + '_' + (item.level || '');
        if (seen.has(uniqueKey)) continue;

        let score = 0;
        let matchType = '';

        if (cleanTerm === cleanQ || cleanReading === cleanQ) {
          score = 100;
          matchType = '文法・表現 完全一致';
        } else if (cleanTerm.startsWith(cleanQ) || (cleanReading && cleanReading.startsWith(cleanQ))) {
          score = 85;
          matchType = '文法 前方一致';
        } else if (cleanTerm.includes(cleanQ) || cleanQ.includes(cleanTerm) || (cleanReading && cleanReading.includes(cleanQ))) {
          score = 75;
          matchType = '文法 関連一致';
        }

        if (score > 0) {
          seen.add(uniqueKey);
          scoredMatches.push({
            ...item,
            score: score,
            matchType: matchType,
            lenDiff: Math.abs(cleanTerm.length - cleanQ.length)
          });
        }
      }

      scoredMatches.sort((a, b) => b.score - a.score || a.lenDiff - b.lenDiff);
      return scoredMatches.slice(0, 5);
    }

    // Direct MyList Toggle
    window.toggleDictCardMylist = function(term, btnElem, explicitReading = '', explicitMeaning = '', explicitLevel = '') {
      const clean = cleanSearchWord(term);
      const isSaved = isTermSavedInMylist(clean);
      let list = [];
      try {
        list = JSON.parse(localStorage.getItem('jlpt_custom_vocab_terms') || '[]');
      } catch(e) { list = []; }

      if (isSaved) {
        list = list.filter(item => item.word !== clean && item.reading !== clean);
        localStorage.setItem('jlpt_custom_vocab_terms', JSON.stringify(list));
        if (btnElem) {
          btnElem.className = 'modal-dict-mylist-btn';
          btnElem.textContent = '⭐ マイリストに追加';
        }
        showToast(`「${clean}」をマイリストから削除しました`);
      } else {
        let word = term;
        let reading = explicitReading || clean;
        let meaning = explicitMeaning || '';
        let level = explicitLevel || 'JLPT';

        if (!explicitMeaning) {
          const dictMatches = searchDictionary(clean);
          if (dictMatches && dictMatches.length > 0) {
            word = dictMatches[0].term;
            reading = dictMatches[0].reading || word;
            meaning = dictMatches[0].meaning || '';
            level = dictMatches[0].level || level;
          }
        }

        list.push({
          id: 'dict_' + Date.now(),
          word: word,
          reading: reading,
          meaning: meaning,
          level: level,
          addedAt: new Date().toISOString()
        });
        localStorage.setItem('jlpt_custom_vocab_terms', JSON.stringify(list));
        if (btnElem) {
          btnElem.className = 'modal-dict-mylist-btn saved';
          btnElem.textContent = '⭐ マイリスト保存済み';
        }
        showToast(`「${word}」をマイリストに保存しました！`);
      }
    };

    document.addEventListener('selectionchange', () => {
      const sel = window.getSelection();
      let str = sel ? sel.toString().trim() : '';
      if (!str || str.length === 0 || str.length > 30) {
        if (selectionTooltip) selectionTooltip.style.display = 'none';
        return;
      }

      // If user selected inside <ruby>, strip <rt> tags cleanly so furigana does not corrupt search
      try {
        const range = sel.getRangeAt(0);
        const clone = range.cloneContents();
        const rts = clone.querySelectorAll('rt');
        rts.forEach(rt => rt.remove());
        const cleanText = clone.textContent.trim();
        if (cleanText) str = cleanText;
      } catch(e) {}

      currentSelectedText = str;
      try {
        const range = sel.getRangeAt(0);
        const rect = range.getBoundingClientRect();
        if (rect && rect.width > 0 && selectionTooltip) {
          selectionTooltip.style.display = 'block';
          selectionTooltip.style.top = `${window.scrollY + rect.top - 40}px`;
          selectionTooltip.style.left = `${window.scrollX + rect.left + (rect.width / 2) - 55}px`;
        }
      } catch(e) {}
    });

    // Helper: Escape HTML
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Helper: Concise English Subtitle for Sidebar
    function formatSidebarEn(meaning) {
      if (!meaning) return '';
      let clean = String(meaning).replace(/^[~〜\s]+|[~〜\s]+$/g, '').trim();
      const parts = clean.split(/[;；]/).map(s => s.trim()).filter(Boolean);
      if (parts.length > 0) {
        clean = parts[0];
        if (parts.length > 1 && (clean.length + parts[1].length < 24)) {
          clean += ' / ' + parts[1];
        }
      }
      return clean.replace(/[~〜]/g, '').trim();
    }

    // Continuous Audio Shadowing Player
    let shadowingActive = false;
    let shadowingTimer = null;
    let shadowingIndex = 0;

    window.toggleShadowingPlay = function() {
      if (shadowingActive) {
        stopShadowing();
        showToast('⏹️ 連続シャドーイング再生を停止しました');
      } else {
        startShadowing();
        showToast('🎧 連続シャドーイング再生を開始しました（各文の後に発声練習できます）');
      }
    };

    function startShadowing() {
      const cards = document.querySelectorAll('#lessonExamplesList .example-item-card');
      if (cards.length === 0) return;
      shadowingActive = true;
      shadowingIndex = 0;

      const btn = document.getElementById('btnToggleShadowing');
      const icon = document.getElementById('shadowingIcon');
      const text = document.getElementById('shadowingText');
      if (btn) btn.classList.add('is-playing');
      if (icon) icon.textContent = '⏹️';
      if (text) text.textContent = '停止 (Stop Shadowing)';

      playShadowingStep();
    }

    function stopShadowing() {
      shadowingActive = false;
      if (shadowingTimer) clearTimeout(shadowingTimer);
      if (globalAudio) {
        try { globalAudio.pause(); } catch(e) {}
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      document.querySelectorAll('#lessonExamplesList .example-item-card').forEach(c => c.classList.remove('is-active-audio'));

      const btn = document.getElementById('btnToggleShadowing');
      const icon = document.getElementById('shadowingIcon');
      const text = document.getElementById('shadowingText');
      if (btn) btn.classList.remove('is-playing');
      if (icon) icon.textContent = '🎧';
      if (text) text.textContent = '例文を連続再生 (Shadowing)';
    }

    function playShadowingStep() {
      if (!shadowingActive) return;
      const cards = document.querySelectorAll('#lessonExamplesList .example-item-card');
      if (shadowingIndex >= cards.length) {
        stopShadowing();
        showToast('🎉 全ての例文のシャドーイングが完了しました！');
        return;
      }

      cards.forEach((c, idx) => {
        if (idx === shadowingIndex) c.classList.add('is-active-audio');
        else c.classList.remove('is-active-audio');
      });

      const currentCard = cards[shadowingIndex];
      const jaEl = currentCard.querySelector('.example-ja');
      const text = jaEl ? jaEl.textContent : '';

      speakJapaneseText(text);

      // Estimate time: speech length + 2.5s pause for student to shadow
      const pauseDuration = Math.max(3000, text.length * 160) + 2500;
      shadowingTimer = setTimeout(() => {
        shadowingIndex++;
        playShadowingStep();
      }, pauseDuration);
    }

    function addToWeaknessPool(q) {
      const key = `${currentGid}_${(q.question || '').slice(0, 15)}`;
      if (!userWeaknessPool.some(item => item.key === key)) {
        userWeaknessPool.push({
          key: key,
          gid: currentGid,
          grammar: grammarMap.get(currentGid)?.name || '',
          question: q.question,
          question_ruby: q.question_ruby,
          choices: q.choices,
          choices_ruby: q.choices_ruby,
          answer: q.answer,
          sentence_jp: q.sentence_jp,
          sentence_jp_ruby: q.sentence_jp_ruby,
          sentence_en: q.sentence_en
        });
        saveWeaknessPool();
      }
    }

    function removeFromWeaknessPool(q) {
      const key = `${currentGid}_${(q.question || '').slice(0, 15)}`;
      const prevLen = userWeaknessPool.length;
      userWeaknessPool = userWeaknessPool.filter(item => item.key !== key);
      if (userWeaknessPool.length !== prevLen) {
        saveWeaknessPool();
      }
    }

    window.checkWeaknessDrillAnswer = function(itemIdx, selectedIdx) {
      const q = userWeaknessPool[itemIdx];
      if (!q) return;

      const card = document.getElementById(`weaknessCard_${itemIdx}`);
      const fb = document.getElementById(`weaknessFb_${itemIdx}`);
      if (!card || !fb) return;

      const isCorrect = (selectedIdx === q.answer);
      const btns = card.querySelectorAll('.quiz-opt-btn');
      btns.forEach((btn, idx) => {
        btn.classList.remove('correct', 'wrong');
        if (idx === q.answer) btn.classList.add('correct');
        else if (idx === selectedIdx && !isCorrect) btn.classList.add('wrong');
      });

      fb.style.display = 'block';
      fb.className = `quiz-feedback ${isCorrect ? 'is-correct' : 'is-wrong'}`;

      const plainSentence = (q.sentence_jp || '')
        .replace(/<rt>[\s\S]*?<\/rt>/gi, '')
        .replace(/<[^>]+>/g, '')
        .replace(/'/g, "'");

      fb.innerHTML = `
        <div class="feedback-status ${isCorrect ? 'correct' : 'wrong'}">
          ${isCorrect ? '🎉 正解！弱点リストからクリアしました！' : `不正解 — 正解は ${q.answer + 1} 番です`}
        </div>
        <div style="margin-top:6px; display:flex; align-items:flex-start; justify-content:space-between; gap:10px;">
          <div><strong>正解の文:</strong> ${q.sentence_jp_ruby || q.sentence_jp}</div>
          <button type="button" class="quiz-fb-tts-btn" onclick="speakJapaneseText('${plainSentence}')" title="音声再生">🔊</button>
        </div>
        <div style="margin-top:4px; font-size:12px; color:var(--text-muted);">
          <strong>English:</strong> ${q.sentence_en || ''}
        </div>
      `;

      if (isCorrect) {
        removeFromWeaknessPool(q);
        setTimeout(() => {
          card.style.transition = 'all 0.3s';
          card.style.opacity = '0.5';
          card.style.transform = 'scale(0.98)';
        }, 800);
      }
    };

      if (btnPrev) {
        btnPrev.disabled = (gid <= 1);
        if (prevLabel) prevLabel.textContent = prevG ? `前: ${prevG.name}` : '前へ (Prev)';
      }
      if (btnNext) {
        btnNext.disabled = (gid >= 182);
        if (nextLabel) nextLabel.textContent = nextG ? `次: ${nextG.name}` : '次へ (Next)';
      }

      if (btnStar) {
        btnStar.classList.toggle('active-star', isBookmarked);
        btnStar.textContent = isBookmarked ? '⭐ 復習中' : '⭐ 復習';
      }
      if (btnDone) {
        btnDone.classList.toggle('active-master', isMastered);
        btnDone.textContent = isMastered ? '✓ 読了！' : '✓ 読了';
      }
    }

    // Initial Load
    window.addEventListener('DOMContentLoaded', () => {
      updateProgress();
      updateWeaknessBadge();
      renderSidebar();
      selectGrammar(1); // Load #1 あげく by default
    });
  </script>
</body>
</html>
