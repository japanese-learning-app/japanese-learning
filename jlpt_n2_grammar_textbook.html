<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JLPT N2 文法マスターテキスト（教科書・解説）</title>
  <style>
    :root {
      /* カラーパレット：メイン青 #1995AD × サクラピンク #FAF1F3 / #B8596E × ポイントネイビー #4D648D */
      --primary-blue: #1995AD;
      --primary-blue-dark: #127285;
      --primary-blue-light: #43B0C4;
      --primary-blue-pale: #EDF7F9;
      --primary-blue-border: #A1D6E2;

      --sakura-pink-bg: #FAF1F3;
      --sakura-pink-soft: #FDF7F8;
      --sakura-pink-accent: #E8A4B2;
      --sakura-pink-deep: #B8596E;
      --sakura-pink-hover: #CE5A73;
      --sakura-pink-border: #F2D5DB;

      --point-navy: #4D648D;
      --point-ice: #D0E1F9;

      --text-primary: #1F2D3D;
      --text-secondary: #4D648D;
      --text-muted: #6B7C8E;

      --card-bg: #FFFFFF;
      --card-border: #F2D5DB;
      --card-shadow: 0 8px 24px rgba(25, 149, 173, 0.07);

      --correct-green: #2E7D32;
      --correct-bg: #E8F5E9;
      --correct-border: #81C784;

      --app-font: 'Inter', "Yu Gothic", YuGothic, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--app-font);
      background-color: var(--sakura-pink-bg);
      color: var(--text-primary);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ルビタイポグラフィ制御 */
    ruby {
      ruby-position: over;
      ruby-align: center;
    }

    ruby rt {
      font-size: 0.54em;
      color: var(--primary-blue-dark);
      font-weight: 600;
      user-select: none;
      letter-spacing: 0;
      line-height: 1;
      transform: translateY(-2px);
    }

    body.hide-furigana ruby rt {
      display: none !important;
    }

    /* Site Header */
    .site-header {
      background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-blue-dark) 60%, var(--point-navy) 100%);
      color: #FFFFFF;
      padding: 12px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(18, 114, 133, 0.22);
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-n2 {
      background: var(--sakura-pink-deep);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      letter-spacing: 0.05em;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-btn {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .header-btn:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    /* Furigana Toggle Pill */
    .furigana-toggle {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 20px;
      padding: 2px;
      cursor: pointer;
      transition: all 0.25s ease;
      user-select: none;
    }

    .toggle-label {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 14px;
      transition: all 0.25s;
    }

    .toggle-label.active {
      background: #FFFFFF;
      color: var(--primary-blue-dark);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
    }

    .toggle-label.inactive {
      color: rgba(255, 255, 255, 0.75);
    }

    /* Mobile Sidebar Toggle Button */
    .btn-mobile-sidebar {
      display: none;
      background: var(--sakura-pink-deep);
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    /* App Layout: 2 Columns (Sidebar + Content) */
    .app-layout {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex: 1;
      padding: 16px 20px;
      gap: 24px;
      position: relative;
    }

    /* Left Sidebar (Categories like Flashcards) */
    .textbook-sidebar {
      width: 320px;
      flex-shrink: 0;
      background: var(--card-bg);
      border: 1px solid var(--sakura-pink-border);
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      padding: 18px 16px;
      height: calc(100vh - 100px);
      position: sticky;
      top: 80px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Search Bar */
    .sidebar-search-box {
      position: relative;
      margin-bottom: 12px;
    }

    .sidebar-search-input {
      width: 100%;
      padding: 9px 12px 9px 34px;
      border: 1.5px solid var(--point-ice);
      border-radius: 10px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      background: #FFFFFF;
      transition: border-color 0.2s;
    }

    .sidebar-search-input:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 3px rgba(25, 149, 173, 0.15);
    }

    .sidebar-search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
      pointer-events: none;
    }

    /* Filter Tabs & Progress */
    .sidebar-filter-tabs {
      display: flex;
      gap: 4px;
      background: var(--sakura-pink-bg);
      padding: 3px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .sidebar-filter-btn {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      padding: 6px 4px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      font-family: inherit;
    }

    .sidebar-filter-btn.active {
      background: #FFFFFF;
      color: var(--sakura-pink-deep);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    /* Progress Mini Bar */
    .sidebar-progress-box {
      background: var(--sakura-pink-soft);
      border: 1px solid var(--sakura-pink-border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 12px;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .progress-bar-bg {
      height: 6px;
      background: #E2ECF2;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-blue), var(--sakura-pink-deep));
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Category List Scroll Area */
    .sidebar-cats-scroll {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
    }

    .sidebar-cats-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .sidebar-cats-scroll::-webkit-scrollbar-thumb {
      background: var(--sakura-pink-border);
      border-radius: 3px;
    }

    .cat-group-heading {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--text-muted);
      margin: 14px 4px 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .cat-unit-card {
      margin-bottom: 6px;
      border: 1px solid var(--sakura-pink-border);
      border-radius: 10px;
      overflow: hidden;
      background: #FFFFFF;
      transition: border-color 0.2s;
    }

    .cat-unit-card.active-unit {
      border-color: var(--primary-blue);
    }

    .cat-unit-header {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      background: #FFFFFF;
      transition: background 0.15s;
    }

    .cat-unit-header:hover {
      background: var(--sakura-pink-soft);
    }

    .cat-unit-title {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cat-unit-count {
      font-size: 11px;
      font-weight: 800;
      background: var(--sakura-pink-bg);
      color: var(--sakura-pink-deep);
      padding: 2px 7px;
      border-radius: 10px;
    }

    .cat-grammar-list {
      display: none;
      background: #FFFFFF; /* 選択以外は白 */
      border-top: 1px solid var(--sakura-pink-border);
      padding: 4px 0;
    }

    .cat-unit-card.expanded .cat-grammar-list {
      display: block;
    }

    .cat-grammar-item {
      padding: 8px 12px 8px 24px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      background: #FFFFFF; /* 未選択項目は白 */
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s;
    }

    .cat-grammar-item:hover {
      background: var(--sakura-pink-soft);
      color: var(--primary-blue-dark);
      padding-left: 28px;
    }

    .cat-grammar-item.active {
      background: var(--primary-blue-pale) !important; /* 選択しているところは青のまま */
      color: var(--primary-blue-dark);
      font-weight: 800;
      border-left: 4px solid var(--primary-blue);
    }

    .grammar-item-badges {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
    }

    .badge-mastered-icon {
      color: var(--correct-green);
    }

    .badge-star-icon {
      color: #D97706;
    }

    /* Right Main Content Area */
    .textbook-main {
      flex: 1;
      min-width: 0;
      padding-bottom: 60px;
    }

    /* Lesson Entry Card */
    .lesson-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--sakura-pink-border);
      box-shadow: var(--card-shadow);
      padding: 30px;
      margin-bottom: 24px;
    }

    .lesson-header {
      border-bottom: 2px solid var(--sakura-pink-bg);
      padding-bottom: 16px;
      margin-bottom: 22px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .lesson-header-left {
      flex: 1;
    }

    .lesson-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .lesson-number-badge {
      background: var(--primary-blue-pale);
      color: var(--primary-blue-dark);
      font-size: 11.5px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 6px;
      border: 1px solid var(--primary-blue-border);
    }

    .unit-crumb-badge {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--sakura-pink-deep);
      background: var(--sakura-pink-bg);
      padding: 3px 9px;
      border-radius: 6px;
      border: 1px solid var(--sakura-pink-border);
    }

    .grammar-title-wrap {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .grammar-name {
      font-size: 26px;
      font-weight: 900;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .grammar-meaning-en {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    /* Action Buttons in Header (Bookmark & Mastered) */
    .lesson-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-pill-btn {
      background: #FFFFFF;
      border: 1.5px solid var(--sakura-pink-border);
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      color: var(--text-secondary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
      font-family: inherit;
    }

    .action-pill-btn:hover {
      background: var(--sakura-pink-soft);
      border-color: var(--sakura-pink-deep);
      color: var(--sakura-pink-deep);
    }

    .action-pill-btn.bookmarked {
      background: #FFFBEB;
      border-color: #FCD34D;
      color: #B45309;
    }

    .action-pill-btn.mastered {
      background: var(--correct-bg);
      border-color: var(--correct-border);
      color: var(--correct-green);
    }

    /* Section Tag */
    .section-block {
      margin-bottom: 24px;
    }

    /* 統一された大枠コンテナ（理解度チェックと同じ淡いピンク背景 ＋ サクラピンク枠線） */
    .textbook-section-box {
      background: var(--sakura-pink-soft);
      border: 1px solid var(--sakura-pink-border);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 24px;
    }

    .section-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--primary-blue-dark);
      background: var(--primary-blue-pale);
      border: 1.5px solid var(--primary-blue-border);
      padding: 5px 13px;
      border-radius: 8px;
      margin-bottom: 14px;
    }

    .section-tag.blue {
      color: #0E7490;
      background: #EDF7F9;
      border-color: #A1D6E2;
    }

    .section-tag.amber {
      color: #B45309;
      background: #FFFBEB;
      border-color: #FDE68A;
    }

    /* Connection Box (清潔感のあるホワイト×シアンアクセント) */
    .connection-box {
      background: #FFFFFF;
      border-left: 4px solid var(--primary-blue);
      padding: 16px 20px;
      border-radius: 0 12px 12px 0;
      font-size: 14px;
      border-top: 1px solid #E2ECF2;
      border-right: 1px solid #E2ECF2;
      border-bottom: 1px solid #E2ECF2;
    }

    .connection-formula {
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 8px;
      line-height: 1.8;
      font-size: 15px;
    }

    .connection-notes {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* Bilingual Callout Cards (Core Nuance & English Pitfalls) */
    .bilingual-card {
      border-radius: 14px;
      padding: 20px 22px;
      margin-bottom: 22px;
    }

    .bilingual-card.nuance {
      background: var(--primary-blue-pale); /* コアニュアンスは青 */
      border: 1.5px solid var(--primary-blue-border);
    }

    /* ⚠️ 英語直訳の落とし穴：注意・警告なのでイエローゴールドに改善！ */
    .bilingual-card.trap {
      background: #FFFBEB; /* 温かみのある注意イエロー */
      border: 1.5px solid #FDE68A;
    }

    .bilingual-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .bilingual-card.nuance .bilingual-header {
      color: var(--primary-blue-dark); /* 青のタイトル */
    }

    .bilingual-card.trap .bilingual-header {
      color: #B45309; /* アンバーブラウン */
    }

    .content-ja {
      font-size: 14.5px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 12px;
      line-height: 1.8;
    }

    .content-en {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      line-height: 1.65;
      padding-top: 12px;
      border-top: 1px dashed rgba(25, 149, 173, 0.25);
    }

    .bilingual-card.trap .content-en {
      border-top-color: rgba(180, 83, 9, 0.25);
      color: #78350F;
    }

    /* Contrast Cards (改行崩れ・窮屈さを完全解消した独立カード構造) */
    .contrast-cards-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 14px;
    }

    /* 対比カード：3つの枠の中の背景は白、左側ボーダーはピンクと青 */
    .contrast-card {
      background: #FFFFFF !important; /* 3つの枠の中の背景はすべて白 */
      border-radius: 12px;
      padding: 14px 18px;
      border: 1px solid var(--sakura-pink-border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .contrast-card.wrong {
      border-left: 4.5px solid var(--sakura-pink-deep) !important; /* 左側はピンク */
      background: #FFFFFF !important;
    }

    .contrast-card.correct {
      border-left: 4.5px solid var(--primary-blue) !important; /* 左側は青 */
      background: #FFFFFF !important;
    }

    .contrast-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .contrast-pill {
      font-size: 11.5px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .contrast-pill.wrong {
      background: #FAF1F3;
      color: var(--sakura-pink-deep); /* ぴんく */
      border: 1px solid var(--sakura-pink-border);
    }

    .contrast-pill.correct {
      background: var(--primary-blue-pale);
      color: var(--primary-blue-dark); /* 青 */
      border: 1px solid var(--primary-blue-border);
    }

    .contrast-reason-chip {
      font-size: 12px;
      font-weight: 700;
      color: var(--sakura-pink-deep); /* ぴんく */
    }

    .contrast-reason-chip.success {
      color: var(--primary-blue-dark); /* 青 */
    }

    .contrast-sentence {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 2.2;
      margin-bottom: 6px;
    }

    .contrast-sentence strong {
      color: var(--primary-blue); /* 青 */
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .contrast-card.wrong .contrast-sentence strong {
      color: var(--sakura-pink-deep); /* ぴんく */
    }

    .contrast-en-note {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.55;
      padding-top: 6px;
      border-top: 1px dashed var(--sakura-pink-border);
    }

    /* Comparison Table (青系ヘッダーで視認性を大幅向上) */
    .comparison-table-wrap {
      overflow-x: auto;
      margin-bottom: 0;
      border-radius: 12px;
      border: 1.5px solid #E2ECF2;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
      background: #FFFFFF;
    }

    .comparison-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: #FFFFFF;
      min-width: 620px;
    }

    .comparison-table th {
      background: #EDF7F9; /* シアン青系の上品なヘッダー背景 */
      color: var(--primary-blue-dark);
      font-weight: 800;
      text-align: left;
      padding: 12px 14px;
      border-bottom: 2px solid #A1D6E2;
    }

    .comparison-table td {
      padding: 14px;
      border-bottom: 1px solid #F1F5F9;
      vertical-align: top;
      line-height: 1.9;
    }

    .comparison-table tr:last-child td {
      border-bottom: none;
    }

    .badge-result-bad {
      background: #FEF2F2;
      color: #DC2626;
      font-weight: 800;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 4px;
      border: 1px solid #FECACA;
      white-space: nowrap;
    }

    .badge-result-both {
      background: #EDF7F9;
      color: #127285;
      font-weight: 800;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 4px;
      border: 1px solid #A1D6E2;
      white-space: nowrap;
    }

    .badge-result-neutral {
      background: #F1F5F9;
      color: #475569;
      font-weight: 800;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 4px;
      border: 1px solid #CBD5E1;
      white-space: nowrap;
    }

    .table-sub-en {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 3px;
      line-height: 1.4;
    }

    /* Examples List (ピンク被りをなくし、クリーンな白背景とスレート枠で文字を最も読みやすく) */
    .examples-list {
      display: flex;
      flex-direction: column;
      gap: 12px;

    // Audio Speech with clean text

    function speakJapaneseText(rawText) {
      if (!rawText) return;
      if (globalAudio) {
        try {
          globalAudio.pause();
          globalAudio.currentTime = 0;
        } catch(e) {}
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      const clean = String(rawText)
        .replace(/<rt>[\s\S]*?<\/rt>/gi, '')
        .replace(/<[^>]+>/g, '')
        .replace(/（\s*）|\(　*\)|（　*）/g, '、')
        .replace(/（する）|\(する\)/g, '')
        .replace(/[【】]/g, '')
        .replace(/\s+/g, ' ')
        .trim();

      if (clean.length <= 200) {
        try {
          const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=ja&client=tw-ob&q=${encodeURIComponent(clean)}`;
          globalAudio = new Audio(url);
          globalAudio.play().catch(() => fallbackSpeech(clean));
          return;
        } catch(e) {}
      }
      fallbackSpeech(clean);
    }

    function fallbackSpeech(text) {
      if (!('speechSynthesis' in window)) return;
      const u = new SpeechSynthesisUtterance(text);

      window.speechSynthesis.speak(u);

      if (elProgressText) elProgressText.textContent = `${countDone} / ${countAll} (${pct}%)`;

          // Search Query check
          if (searchQuery) {

            if (!matchName && !matchReading && !matchMeaning) return false;
          }
          return true;

                    <ruby>家族<rt>かぞく</rt></ruby>と<ruby>話<rt>はな</rt></ruby>し<ruby>合<rt>あ</rt></ruby>った<strong><ruby>末<rt>すえ</rt></ruby>に</strong>、<ruby>留学<rt>りゅうがく</rt></ruby>を<ruby>決<rt>き</rt></ruby>めた。
                  </td>
                </tr>
                <tr>
                  <td>
                    <strong style="color:var(--text-primary); font-size:14px;">〜結果</strong><br>
                    <span class="table-sub-en">as a result of</span>
                  </td>
                  <td>
                    <span class="badge-result-neutral">⚪ 中立（客観的事実）</span><br>
                    <span class="table-sub-en">Neutral Fact</span>
                  </td>
                  <td>
                    単に「原因 ➔ 結果」を客観的に報告する。感情や失望感は含まない。<br>
                    <span class="table-sub-en">Objective reporting of fact; carries no emotional coloring.</span>
                  </td>
                  <td>
                    <ruby>調査<rt>ちょうさ</rt></ruby>した<strong><ruby>結果<rt>けっか</rt></ruby></strong>、<ruby>異常<rt>いじょう</rt></ruby>は見つからなかった。
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        `;
      } else {
        // Universal Standard Layout for any of the 195 Grammars
        formulaEl.innerHTML = `文法形式: <strong>${g.name}</strong> （${g.reading || ''}）`;
        notesEl.innerHTML = g.similar ? `関連・類似表現: ${g.similar}` : '文脈に応じた適切な接続形に注意しましょう。';

        nuanceEl.innerHTML = `
          <div class="bilingual-header">
            <span>💡 コアニュアンス（使い方のポイント / Core Nuance & Usage）</span>
          </div>
          <div class="content-ja">
            「${g.name}」は、${g.meaning_en} を表すN2重要文法項目です。前後の接続関係および話者の意図（強調、理由、結末など）を的確に捉えて使いこなすことが合格のカギとなります。
          </div>
          <div class="content-en">
            "${g.name}" is a critical N2 pattern meaning: <strong>${g.meaning_en}</strong>. Pay close attention to its grammatical form and the speaker's nuance when reading or listening.
          </div>
        `;

        trapEl.innerHTML = `
          <div class="bilingual-header">
            <span>⚠️ 学習上の注意点と落とし穴 (Points to Note)</span>
          </div>
          <div class="content-ja">
            選択肢には類似した接続詞や助詞（${g.similar || '似た文法'}）がひっかけとして配置されます。前後の述語の肯定・否定の呼応に注意して解答しましょう。
          </div>
          <div class="content-en">
            Similar patterns often appear as distractor choices in JLPT exams. Distinguish their subtle constraints carefully.
          </div>
        `;

        compEl.innerHTML = `
          <div class="section-tag blue" style="margin-bottom:14px;">🔍 関連・類似表現 (Related Expressions)</div>
          <div style="background:#FFFFFF; border:1px solid var(--sakura-pink-border); border-radius:10px; padding:16px; font-size:13.5px; box-shadow:0 2px 6px rgba(0,0,0,0.02);">
            ${g.similar ? `<strong>類語・関連表現:</strong> ${g.similar}` : '文脈判断が重視される重要表現です。'}
          </div>
        `;
      }

      // Fill Examples
      exListEl.innerHTML = '';
      const sampleExs = qList.map(q => ({
        ja: q.sentence_jp_ruby || q.sentence_jp,
        en: q.sentence_en || ''
      }));

      // Add #1 specific examples if GID=1
      if (gid === 1) {
        sampleExs.unshift({
          ja: '<ruby>何日<rt>なんにち</rt></ruby>も<ruby>悩<rt>なや</rt></ruby>んだあげく、<ruby>会社<rt>かいしゃ</rt></ruby>を<ruby>辞<rt>や</rt></ruby>めることにした。',
          en: 'After agonizing for days, I ended up deciding to quit my job.'
        });
      }

      sampleExs.slice(0, 4).forEach((ex, idx) => {
        const plainJa = ex.ja.replace(/<[^>]+>/g, '').replace(/'/g, "\'");
        const exCard = document.createElement('div');
        exCard.className = 'example-item-card';
        exCard.innerHTML = `
          <button class="example-tts-btn" onclick="speakJapaneseText('${plainJa}')" title="音声を再生">🔊</button>
          <div class="example-content">
            <div class="example-ja">${ex.ja}</div>
            <div class="example-en">${ex.en}</div>
          </div>
        `;
        exListEl.appendChild(exCard);
      });

      // Fill 4-5 Quizzes
      quizContainer.innerHTML = '';
      qList.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'quiz-card';
        card.id = `quizCard_${qIndex}`;

        let questionHtml = q.question_ruby || q.question;
        // Make blank pretty
        questionHtml = questionHtml.replace(/【\s*　*\s*】|（\s*　*\s*）|\(\s*\)/g, '<span class="quiz-blank">（　　　）</span>');

        const choices = q.choices_ruby || q.choices;
        const choicesHtml = choices.map((c, cIdx) => `
          <button class="quiz-opt-btn" onclick="checkLessonQuiz(${qIndex}, ${cIdx}, ${cIdx === q.answer})">
            ${cIdx + 1}. ${c}
          </button>
        `).join('');

        card.innerHTML = `
          <div class="quiz-qnum">第 ${qIndex + 1} 問 (Question ${qIndex + 1})</div>
          <div class="quiz-sentence">${questionHtml}</div>
          <div class="quiz-options">${choicesHtml}</div>
          <div class="quiz-feedback" id="quizFeedback_${qIndex}">
            <div class="feedback-status" id="quizStatus_${qIndex}"></div>
            <div class="feedback-ja" id="quizFbJa_${qIndex}"></div>
            <div class="feedback-en" id="quizFbEn_${qIndex}"></div>
          </div>
        `;
        quizContainer.appendChild(card);
      });
    }

    // Mini Quiz Check
    window.checkLessonQuiz = function(qIndex, selectedIdx, isCorrect) {
      const card = document.getElementById(`quizCard_${qIndex}`);
      if (!card) return;

      const qList = (grammarQuestionsMap.get(currentGid) || []).slice(0, 5);
      const q = qList[qIndex];
      if (!q) return;

      const btns = card.querySelectorAll('.quiz-opt-btn');
      btns.forEach((btn, idx) => {
        btn.classList.remove('correct', 'wrong');
        if (idx === q.answer) {
          btn.classList.add('correct');
        } else if (idx === selectedIdx && !isCorrect) {
          btn.classList.add('wrong');
        }
      });

      const fb = document.getElementById(`quizFeedback_${qIndex}`);
      const st = document.getElementById(`quizStatus_${qIndex}`);
      const fbJa = document.getElementById(`quizFbJa_${qIndex}`);
      const fbEn = document.getElementById(`quizFbEn_${qIndex}`);

      if (fb && st && fbJa && fbEn) {
        fb.style.display = 'block';
        fb.className = `quiz-feedback ${isCorrect ? 'is-correct' : 'is-wrong'}`;
        st.className = `feedback-status ${isCorrect ? 'correct' : 'wrong'}`;
        st.textContent = isCorrect ? "◯ 正解！ 素晴らしい！ (Correct!)" : `✕ 不正解 (Incorrect) — 正解は ${q.answer + 1} 番です`;

        fbJa.innerHTML = `<strong>正解の文:</strong> ${q.sentence_jp_ruby || q.sentence_jp}`;
        fbEn.innerHTML = `<strong>English:</strong> ${q.sentence_en || ''}`;
      }
    };

    // Filter Buttons Listener
    document.querySelectorAll('.sidebar-filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.sidebar-filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderSidebar();
      });
    });

    // Search Input Listener
    const searchInput = document.getElementById('sidebarSearchInput');
    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        renderSidebar();
      });
    }

    // Mobile Sidebar Drawer
    const btnOpenSidebar = document.getElementById('btnOpenSidebar');
    const textbookSidebar = document.getElementById('textbookSidebar');
    const sidebarBackdrop = document.getElementById('sidebarBackdrop');

    function openSidebarMobile() {
      if (textbookSidebar) textbookSidebar.classList.add('open');
      if (sidebarBackdrop) sidebarBackdrop.classList.add('open');
    }

    function closeSidebarMobile() {
      if (textbookSidebar) textbookSidebar.classList.remove('open');
      if (sidebarBackdrop) sidebarBackdrop.classList.remove('open');
    }

    if (btnOpenSidebar) btnOpenSidebar.addEventListener('click', openSidebarMobile);
    if (sidebarBackdrop) sidebarBackdrop.addEventListener('click', closeSidebarMobile);

    // Dictionary Integration (68,000 words + MyList + Grammar Reverse Lookup)
    const modalDictOverlay = document.getElementById('modalDictOverlay');
    const modalDictSearchInput = document.getElementById('modalDictSearchInput');
    const btnExecuteDictSearch = document.getElementById('btnExecuteDictSearch');
    const modalDictResultContent = document.getElementById('modalDictResultContent');
    const btnCloseDictModal = document.getElementById('btnCloseDictModal');
    const btnHeaderDictSearch = document.getElementById('btnHeaderDictSearch');

    function cleanSearchWord(w) {
      if (!w) return '';
      return String(w)
        .replace(/<[^>]+>/g, '')
        .replace(/[「」『』【】（）\(\)\s、。,.!?！？]/g, '')
        .trim();
    }

    function isTermSavedInMylist(term) {
      const clean = cleanSearchWord(term);
      try {
        if (window.UserProgress && typeof window.UserProgress.isCustomVocabTermSaved === 'function') {
          return window.UserProgress.isCustomVocabTermSaved(clean);
        }
        const list = JSON.parse(localStorage.getItem('jlpt_custom_vocab_terms') || '[]');
        return list.some(item => item.word === clean || item.reading === clean);
      } catch(e) {
        return false;
      }
    }

    function searchDictionary(query) {
      const cleanQ = cleanSearchWord(query);
      if (!cleanQ) return null;
      if (window.DICT_DATA && Array.isArray(window.DICT_DATA)) {
        const dMatch = window.DICT_DATA.find(d => d.w === cleanQ || d.r === cleanQ)
          || window.DICT_DATA.find(d => d.w && d.w.startsWith(cleanQ))
          || window.DICT_DATA.find(d => (d.w && d.w.includes(cleanQ)) || (d.r && d.r.includes(cleanQ)));
        if (dMatch) {
          return {
            term: dMatch.w,
            reading: dMatch.r,
            meaning: dMatch.m,
            level: dMatch.l ? `JLPT ${dMatch.l}` : '常用語',
            example_ja: dMatch.ex || '',
            example_en: dMatch.tr || '',
            similar: dMatch.sim || ''
          };
        }
      }
      return null;
    }

    // Check if query matches any of 195 grammars for reverse lookup
    function findMatchingGrammar(query) {
      const cleanQ = cleanSearchWord(query);
      for (const [gid, g] of grammarMap.entries()) {
        if (g.name.includes(cleanQ) || cleanQ.includes(g.name.replace(/[〜~]/g, ''))) {
          return g;
        }
      }
      return null;
    }

    function renderDictLookup(query) {
      if (!modalDictResultContent) return;
      const cleanQ = cleanSearchWord(query);
      const result = searchDictionary(query);
      const matchGrammar = findMatchingGrammar(query);

      let grammarLinkHtml = '';
      if (matchGrammar) {
        grammarLinkHtml = `
          <div style="margin-top:10px;">
            <a href="javascript:void(0)" class="modal-dict-grammar-link" onclick="closeDictModal(); selectGrammar(${matchGrammar.id});">
              📖 文法テキスト「#${matchGrammar.id} ${matchGrammar.name}」の解説を見る →
            </a>
          </div>
        `;
      }

      if (!result) {
        if (matchGrammar) {
          modalDictResultContent.innerHTML = `
            <div class="modal-dict-card">
              <div class="modal-dict-card-header">
                <div class="modal-dict-card-word">
                  <span>${matchGrammar.name}</span>
                </div>
                <span class="modal-dict-card-badge">JLPT N2 文法</span>
              </div>
              <div class="modal-dict-card-meaning">${matchGrammar.meaning_en}</div>
              ${grammarLinkHtml}
            </div>
          `;
          return;
        }
        modalDictResultContent.innerHTML = `<div style="padding:16px;color:var(--text-muted);text-align:center;">「${cleanQ}」に該当する単語が見つかりませんでした。</div>`;
        return;
      }

      const escapedTerm = result.term.replace(/'/g, "\'");
      const readingPart = (result.reading && result.reading !== result.term)
        ? `<span class="modal-dict-card-reading">（${result.reading}）</span>`
        : '';

      let exHtml = '';
      if (result.example_ja) {
        const plainEx = result.example_ja.replace(/<[^>]+>/g, '').replace(/'/g, "\'");
        exHtml = `
          <div class="modal-dict-card-ex-box">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">
              <div class="modal-dict-card-ex-ja">${result.example_ja}</div>
              <button class="modal-dict-tts-btn" onclick="speakJapaneseText('${plainEx}')" title="例文の発音を再生">🔊</button>
            </div>
            ${result.example_en ? `<div class="modal-dict-card-ex-en">${result.example_en}</div>` : ''}
          </div>
        `;
      }

      const isSaved = isTermSavedInMylist(result.term);
      const mylistBtnHtml = `
        <button type="button" class="modal-dict-mylist-btn ${isSaved ? 'saved' : ''}" onclick="window.toggleDictCardMylist('${escapedTerm}', this)">
          ⭐ ${isSaved ? 'マイリスト保存済み' : 'マイリストに追加'}
        </button>
      `;

      modalDictResultContent.innerHTML = `
        <div class="modal-dict-card">
          <div class="modal-dict-card-header">
            <div class="modal-dict-card-word">
              <span>${result.term}</span>
              ${readingPart}
              <button class="modal-dict-tts-btn" onclick="speakJapaneseText('${escapedTerm}')" title="発音を再生">🔊</button>
            </div>
            <div style="display:flex;align-items:center;gap:6px;">
              ${mylistBtnHtml}
              <span class="modal-dict-card-badge">${result.level}</span>
            </div>
          </div>
          <div class="modal-dict-card-meaning">${result.meaning}</div>
          ${exHtml}
          ${grammarLinkHtml}
        </div>
      `;
    }

    function openDictModal(term = '') {
      if (!modalDictOverlay) return;
      modalDictOverlay.style.display = 'flex';
      const cleanQ = cleanSearchWord(term);
      if (modalDictSearchInput) {
        modalDictSearchInput.value = cleanQ;
      }
      if (cleanQ) {
        renderDictLookup(cleanQ);
      } else if (modalDictResultContent) {
        modalDictResultContent.innerHTML = '<div style="padding:16px;color:var(--text-muted);text-align:center;">検索したい言葉を入力してください。</div>';
      }
    }

    function closeDictModal() {
      if (modalDictOverlay) modalDictOverlay.style.display = 'none';
    }

    if (btnCloseDictModal) btnCloseDictModal.addEventListener('click', closeDictModal);
    if (modalDictOverlay) {
      modalDictOverlay.addEventListener('click', (e) => {
        if (e.target === modalDictOverlay) closeDictModal();
      });
    }
    if (btnHeaderDictSearch) {
      btnHeaderDictSearch.addEventListener('click', () => openDictModal());
    }
    if (btnExecuteDictSearch) {
      btnExecuteDictSearch.addEventListener('click', () => {
        if (modalDictSearchInput) renderDictLookup(modalDictSearchInput.value);
      });
    }
    if (modalDictSearchInput) {
      modalDictSearchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') renderDictLookup(modalDictSearchInput.value);
      });
    }

    // Direct MyList Toggle
    window.toggleDictCardMylist = function(term, btnElem) {
      const clean = cleanSearchWord(term);
      const isSaved = isTermSavedInMylist(clean);
      let list = [];
      try {
        list = JSON.parse(localStorage.getItem('jlpt_custom_vocab_terms') || '[]');
      } catch(e) { list = []; }

      if (isSaved) {
        list = list.filter(item => item.word !== clean && item.reading !== clean);
        localStorage.setItem('jlpt_custom_vocab_terms', JSON.stringify(list));
        if (btnElem) {
          btnElem.className = 'modal-dict-mylist-btn';
          btnElem.textContent = '⭐ マイリストに追加';
        }
        showToast(`「${clean}」をマイリストから削除しました`);
      } else {
        const itemData = searchDictionary(clean) || { term: clean, reading: clean, meaning: '登録単語' };
        list.push({
          id: 'dict_' + Date.now(),
          word: itemData.term,
          reading: itemData.reading || itemData.term,
          meaning: itemData.meaning || '',
          level: itemData.level || 'JLPT N2',
          addedAt: new Date().toISOString()
        });
        localStorage.setItem('jlpt_custom_vocab_terms', JSON.stringify(list));
        if (btnElem) {
          btnElem.className = 'modal-dict-mylist-btn saved';
          btnElem.textContent = '⭐ マイリスト保存済み';
        }
        showToast(`「${clean}」をマイリストに保存しました！`);
      }
    };

    // Text Selection Tooltip
    const selectionTooltip = document.getElementById('selectionDictTooltip');
    const btnSearchSelection = document.getElementById('btnSearchSelection');
    let currentSelectedText = '';

    document.addEventListener('selectionchange', () => {
      const sel = window.getSelection();
      const str = sel ? sel.toString().trim() : '';
      if (!str || str.length === 0 || str.length > 30) {
        if (selectionTooltip) selectionTooltip.style.display = 'none';
        return;
      }
      currentSelectedText = str;
      try {
        const range = sel.getRangeAt(0);
        const rect = range.getBoundingClientRect();
        if (rect && rect.width > 0 && selectionTooltip) {
          selectionTooltip.style.display = 'block';
          selectionTooltip.style.top = `${window.scrollY + rect.top - 40}px`;
          selectionTooltip.style.left = `${window.scrollX + rect.left + (rect.width / 2) - 55}px`;
        }
      } catch(e) {}
    });

    if (btnSearchSelection) {
      btnSearchSelection.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (currentSelectedText) {
          openDictModal(currentSelectedText);
          if (selectionTooltip) selectionTooltip.style.display = 'none';
        }
      });
    }

    // Copy Snackbar
    const copySnackbar = document.getElementById('copyDictSnackbar');
    const copySnackWord = document.getElementById('copySnackWord');
    const btnCopySnackSearch = document.getElementById('btnCopySnackSearch');
    const btnCloseCopySnack = document.getElementById('btnCloseCopySnack');
    let lastCopiedWord = '';

    document.addEventListener('copy', () => {
      const sel = window.getSelection();
      const selText = sel ? sel.toString().trim() : '';
      if (selText && selText.length > 0 && selText.length <= 30) {
        lastCopiedWord = selText;
        if (copySnackWord) copySnackWord.textContent = selText;
        if (copySnackbar) {
          copySnackbar.style.display = 'flex';
          clearTimeout(window._copySnackTimer);
          window._copySnackTimer = setTimeout(() => {
            if (copySnackbar) copySnackbar.style.display = 'none';
          }, 5000);
        }
      }
    });

    if (btnCopySnackSearch) {
      btnCopySnackSearch.addEventListener('click', () => {
        if (lastCopiedWord) {
          openDictModal(lastCopiedWord);
          if (copySnackbar) copySnackbar.style.display = 'none';
        }
      });
    }

    if (btnCloseCopySnack) {
      btnCloseCopySnack.addEventListener('click', () => {
        if (copySnackbar) copySnackbar.style.display = 'none';
      });
    }

    // Initial Load
    window.addEventListener('DOMContentLoaded', () => {
      updateProgress();
      renderSidebar();
      selectGrammar(1); // Load #1 あげく by default
    });
  </script>
</body>
</html>
